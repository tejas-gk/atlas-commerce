apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlas-commerce
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: api.atlas.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
    - host: app.atlas.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
    - host: seller.atlas.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seller-ui
                port:
                  number: 80
    - host: admin.atlas.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-ui
                port:
                  number: 80
    - host: chat.atlas.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ghast-chat-web
                port:
                  number: 80
